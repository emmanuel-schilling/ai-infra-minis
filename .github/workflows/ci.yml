name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.4.4"
  NINJA_VERSION: "1.13.2"
  CLANG_FORMAT_VERSION: "23.1.3"
  CLANG_TIDY_VERSION: "23.1.4"
  # Must match builtin-baseline in vcpkg.json.
  VCPKG_COMMIT: d186940b2f0c4e8e5b4ff804af57d2a26fbfa091

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15 runners are arm64, so x86 SIMD paths are tested on Linux
        # and Windows only.
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true

      # PLATFORM: windows — Ninja builds with MSVC need the Visual Studio
      # developer environment; Linux and macOS compilers are already on PATH.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-ChildItem env: |
            Where-Object { $before[$_.Name] -ne $_.Value } |
            ForEach-Object { "$($_.Name)=$($_.Value)" } |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The runners' own CMake can be older than this project needs, so the
      # pinned tools go first on PATH.
      - name: Install CMake and Ninja
        run: |
          uv tool install "cmake==$CMAKE_VERSION"
          uv tool install "ninja==$NINJA_VERSION"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Restore vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}

      # A blobless clone keeps the history that vcpkg's versioning reads,
      # fetching file contents only when needed.
      - name: Set up vcpkg
        run: |
          tmp="${RUNNER_TEMP//\\//}"
          git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg.git "$tmp/vcpkg"
          git -C "$tmp/vcpkg" checkout --quiet "$VCPKG_COMMIT"
          mkdir -p "$tmp/vcpkg-cache"
          echo "VCPKG_ROOT=$tmp/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$tmp/vcpkg-cache" >> "$GITHUB_ENV"

      # PLATFORM: windows — vcpkg bootstraps with a batch file there and a
      # shell script elsewhere.
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics'

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version

      - name: Install Python tools
        run: uv sync --locked

      - name: Check Python
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          # pytest exits 5 when it collects no tests: nothing failed.
          uv run pytest -q || [ $? -eq 5 ]

      - name: Check C++
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev

  lint:
    name: Format and lint C++
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # clang-tidy reads the compile commands, so the build uses clang to give
    # it flags it understands.
    env:
      CC: clang
      CXX: clang++
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install tools
        run: |
          uv tool install "cmake==$CMAKE_VERSION"
          uv tool install "ninja==$NINJA_VERSION"
          uv tool install "clang-format==$CLANG_FORMAT_VERSION"
          uv tool install "clang-tidy==$CLANG_TIDY_VERSION"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Restore vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-lint-${{ hashFiles('vcpkg.json') }}

      - name: Set up vcpkg
        run: |
          git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset dev

      - name: clang-format
        run: git ls-files -z '*.cpp' '*.hpp' '*.h' | xargs -0 -r clang-format --dry-run --Werror

      # Runs on every source file in the compile commands, which leaves out
      # macOS-only files such as the Accelerate wrapper.
      - name: clang-tidy
        run: run-clang-tidy.py -p build -quiet
