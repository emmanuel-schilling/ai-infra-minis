# Root of the uv workspace: the shared development tools. Each Python project
# joins as a workspace member once it has code.
[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
